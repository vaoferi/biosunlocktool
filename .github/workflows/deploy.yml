name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    name: Build and Deploy
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # cache: 'npm' навмисно НЕ ставимо: у репо немає package-lock.json,
          # а setup-node падає з помилкою, якщо lockfile відсутній.
        # Node ≥20 обов'язковий: wrangler відмовляється працювати на 18
        # (і тоді крок створення проєкту мовчки не виконується).

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Build
        run: node build.js

      - name: Publish to Pages
        # pages-action@v1 використовує застарілий API-шлях getProject, який
        # може отримати Cloudflare 429 ще до завантаження файлів. Wrangler
        # виконує нативний Pages deploy і використовує ті самі secrets.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if wrangler pages deploy . --project-name biosunlocktool; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Cloudflare Pages deploy failed; retrying after 60s (attempt ${attempt}/3)"
              sleep 60
            fi
          done
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
