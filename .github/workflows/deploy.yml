name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    name: Build and Deploy
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # cache: 'npm' навмисно НЕ ставимо: у репо немає package-lock.json,
          # а setup-node падає з помилкою, якщо lockfile відсутній.
        # Node ≥20 обов'язковий: wrangler відмовляється працювати на 18
        # (і тоді крок створення проєкту мовчки не виконується).

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Ensure Pages project exists
        # pages-action@v1 НЕ створює проєкт сам (спершу робить GET і падає з
        # "Project not found"), тому створюємо ідемпотентно тут.
        run: wrangler pages project create biosunlocktool --production-branch main || echo "project already exists"
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}

      - name: Build
        run: node build.js

      - name: Publish to Pages
        uses: cloudflare/pages-action@v1
        with:
          accountId: ${{ env.CF_ACCOUNT_ID }}
          # ВАЖЛИВО: параметр pages-action називається apiToken (не apiKey).
          apiToken: ${{ env.CF_API_TOKEN }}
          projectName: biosunlocktool
          directory: .
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
